[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycelium"
version = "0.1.0"
description = "Multi-agent memory and coordination system"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "asyncpg>=0.30.0",
    "httpx>=0.28.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "pydantic>=2.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pyyaml>=6.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mycelium"]

[project.scripts]
mycelium-server = "mycelium.server.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires Postgres (deselect with '-m not integration')",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
stubPath = "typings"
