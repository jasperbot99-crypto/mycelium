name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pyright
        run: pyright
      - name: Unit + Scenarios
        run: pytest tests/unit tests/scenarios
      - name: Benchmarks
        run: |
          python -m benchmarks.run --iterations 100
          python scripts/assert_benchmarks.py

  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Typecheck SDK
        run: |
          cd sdk/typescript
          npm install --ignore-scripts
          npm run typecheck
